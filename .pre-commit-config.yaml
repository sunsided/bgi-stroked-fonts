---
repos:
  - repo: https://github.com/DevinR528/cargo-sort
    rev: v2.1.3
    hooks:
      - name: Sort dependencies alphabetically
        id: cargo-sort
        args:
          - --workspace
        files: \.toml$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt
        description: Check if all files follow the rustfmt style
        entry: cargo fmt --all -- --color always
        language: system
        files: \.rs$
        pass_filenames: false
      - id: clippy
        name: clippy
        description: Check if all files implement Clippy lints
        entry: cargo clippy -- -D warnings
        language: system
        files: \.rs$
        pass_filenames: false

  - repo: https://github.com/thlorenz/doctoc
    rev: v2.3.0
    hooks:
      - name: Generate Markdown Table of Contents
        id: doctoc
        args:
          - --github
          - --update-only
